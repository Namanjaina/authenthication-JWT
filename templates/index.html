<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #89f7fe, #66a6ff);
            height: 100vh;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: flex-end;
        }

        /* Logout Button */
        .logout-btn {
            text-decoration: none;
            background: #ff4b5c;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 14px;
            transition: 0.3s ease;
            animation: slideIn 1s ease;
        }

        /* Hover effect */
        .logout-btn:hover {
            background: #ff1e38;
            transform: scale(1.1);
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        }

        /* Slide animation */
        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Content center */
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            color: white;
        }

        h1 {
            font-size: 40px;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="{% url 'logout' %}" class="logout-btn">Logout 🚪</a>
    </div>

    <!-- Content -->
    <div class="content">
        <h1>welcome to my authentication website 👋</h1>
    </div>

</body>
</html>
